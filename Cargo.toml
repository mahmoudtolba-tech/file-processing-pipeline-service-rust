[package]
name = "file_pipeline_service"
version = "0.1.0"
edition = "2021"
authors = ["Mahmoud Tolba <mahmoud.tolba@example.com>"]
license = "MIT"
description = "A high‑performance file processing pipeline service built with Actix‑web and SQLx."
repository = "https://github.com/mahmoudtolba/file_pipeline_service"

[dependencies]
actix-web = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "macros", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15"
config = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
thiserror = "1.0"
validator = { version = "0.16", features = ["derive"] }

[dev-dependencies]
actix-rt = "2.9"
reqwest = { version = "0.11", features = ["json"] }