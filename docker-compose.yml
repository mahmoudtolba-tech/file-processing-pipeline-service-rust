version: "3.9"

services:
  app:
    build:
      context: .
      target: build
    environment:
      - PG_USER=user
      - PG_PASSWORD=password
      - PG_DATABASE=database
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:12
    environment:
      - PG_USER=user
      - PG_PASSWORD=password
      - PG_DATABASE=database
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:

